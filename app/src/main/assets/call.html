<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видеозвонок</title>
<style>
:root {
  --teal: #0D9488; --teal-dark: #0b7a70; --bg: #0b1514; --panel: #12201f; --text: #e8f5f3; --muted: #9fb8b4; --red: #dc2626;
  --warn-bg: #3a2a0c; --warn-line: #b45309; --warn-text: #fde68a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, Arial, sans-serif; overflow: hidden; }
body { display: flex; flex-direction: column; }
header { background: var(--teal); color: #fff; text-align: center; padding: 9px 12px 8px; flex: 0 0 auto; }
#title { font-size: 17px; font-weight: 600; line-height: 1.25; }
#sub { font-size: 13px; opacity: .92; margin-top: 2px; min-height: 17px; }
#warn { flex: 0 0 auto; position: relative; padding: 7px 38px 7px 12px; font-size: 13px; line-height: 1.35; color: var(--warn-text); background: var(--warn-bg); border-bottom: 1px solid var(--warn-line); }
#warn[hidden] { display: none; }
#warnX { position: absolute; right: 6px; top: 4px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 17px; line-height: 1; color: var(--warn-text); border-radius: 6px; cursor: pointer; user-select: none; }
#warnX:hover { background: rgba(255,255,255,.14); }
#warnX:focus-visible { outline: 3px solid #5eead4; outline-offset: 1px; }
#wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
main { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; background: #000; display: flex; align-items: center; justify-content: center; }
#rv { width: 100%; height: 100%; object-fit: contain; background: #000; display: none; }
#rv.live { display: block; }
/* 7.6: редко нужное (зеркало, поворот, вид, запись, качество, выбор устройств) спрятано под «Ещё», чтобы на телефоне хватало места видео */
#dock { position: relative; flex: 0 0 auto; }
#more { display: none; position: absolute; left: 0; right: 0; bottom: 100%; z-index: 6; max-height: 62vh; overflow-y: auto; background: var(--vu-bg); color: var(--vu-text); font-size: 12px; border-top: 2px solid var(--teal); box-shadow: 0 -6px 14px rgba(0,0,0,.45); }
#more.open { display: block; }
#more #dev { padding: 6px 12px 10px; }
#more footer { background: var(--panel); }
button.more { flex: 0 0 auto; min-width: 70px; max-width: 150px; }

#ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 40%, #16302d 0%, #0b1514 70%); text-align: center; padding: 20px; }
#av { width: 112px; height: 112px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 52px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
#phn { font-size: 20px; font-weight: 600; }
#pht { font-size: 14px; color: var(--muted); max-width: 520px; line-height: 1.4; }
#lv { position: absolute; right: 12px; bottom: 12px; width: 168px; height: 95px; object-fit: cover; background: #111; border: 2px solid var(--teal); border-radius: 8px; transform: scaleX(-1); }
#lv.off { display: none; }
/* 4.0: индикаторы уровня звука: слышно ли собеседника и слышно ли вас */
:root { --vu-bg: #0b1514; --vu-track: #1d2f2d; --vu-fill: #0D9488; --vu-hot: #f59e0b; --vu-text: #cfe3e0; --vu-bad: #fca5a5; }
@media (prefers-color-scheme: light) { :root { --vu-bg: #e8f3f1; --vu-track: #c5d9d6; --vu-fill: #0b7a70; --vu-hot: #b45309; --vu-text: #12302d; --vu-bad: #b91c1c; } }
#vu { flex: 0 0 auto; background: var(--vu-bg); color: var(--vu-text); padding: 6px 12px 4px; border-top: 1px solid rgba(255,255,255,.06); font-size: 12px; line-height: 1.25; }
#vu .vrow { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
#vu .vl { flex: 0 0 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#vu .vbar { position: relative; flex: 1 1 auto; height: 10px; background: var(--vu-track); border-radius: 5px; overflow: hidden; }
#vu .vbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--vu-fill); border-radius: 5px; }
#vu .vbar b { position: absolute; top: 0; bottom: 0; width: 2px; left: 0; background: var(--vu-hot); }
#vu .vn { flex: 0 0 96px; text-align: right; font-variant-numeric: tabular-nums; }
#vu .vw { min-height: 15px; color: var(--vu-bad); padding-left: 158px; }
#rec, #peerRec { position: absolute; top: 10px; z-index: 5; padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #fff; background: rgba(0,0,0,.55); }
#rec { left: 12px; border: 2px solid #ef4444; } #rec b { color: #ef4444; animation: blink 1s steps(2, start) infinite; }
#peerRec { right: 12px; border: 2px solid #f59e0b; color: #fde68a; }
@keyframes blink { to { visibility: hidden; } }
#rec[hidden], #peerRec[hidden], #toast[hidden] { display: none; }
#toast { position: fixed; left: 12px; right: 12px; bottom: 148px; z-index: 8; padding: 8px 12px; border-radius: 8px; background: #0b7a70; color: #fff; font-size: 13px; word-break: break-all; }
footer.cap button.sm { flex: 0 0 auto; min-width: 44px; max-width: 54px; padding: 6px 8px; } footer.cap button.sm .lbl { display: none; } footer.cap { padding-top: 0; } footer.cap button { min-height: 34px; font-size: 13px; }
footer { flex: 0 0 auto; background: var(--panel); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
button { flex: 1 1 140px; min-width: 104px; max-width: 230px; min-height: 40px; padding: 8px 10px; font: inherit; font-size: 14px; font-weight: 600; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--text); background: transparent; border: 2px solid var(--teal); border-radius: 8px; cursor: pointer; }
button:hover { background: rgba(13,148,136,.22); }
button:focus-visible { outline: 3px solid #5eead4; outline-offset: 2px; }
button.off { border-color: #6b7f7c; color: var(--muted); text-decoration: line-through; }
button.end { border-color: var(--red); color: #fecaca; }
button.end:hover { background: rgba(220,38,38,.25); }
button:disabled { opacity: .5; cursor: default; }
button svg { flex: 0 0 auto; width: 19px; height: 19px; fill: currentColor; }
@media (max-width: 600px) {
  footer { padding: 6px 6px; gap: 5px; }
  button { flex: 1 1 0; min-width: 0; padding: 6px 2px; font-size: 12px; gap: 3px; overflow: hidden; }
  #mainRow { flex-wrap: wrap; }
  #mainRow button:not(.more) { flex: 1 1 22%; }
  button.more { flex: 1 1 45%; min-width: 0; max-width: none; }
  button:not(.sm) svg { display: none; }
  #capRow { flex-wrap: nowrap; } #capRow button.sm { flex: 0 0 auto; min-width: 38px; padding: 6px 4px; }
  #vu .vl { flex-basis: 104px; } #vu .vn { flex-basis: 92px; white-space: nowrap; font-size: 11px; } #vu .vw { padding-left: 0; }
  #dev select { max-width: 100%; min-width: 0; width: 100%; }
  #dev label { width: 100%; flex-direction: column; align-items: stretch; gap: 2px; text-align: left; }
}
}
button.off .lbl { text-decoration: line-through; }
button .lbl { white-space: normal; text-align: center; line-height: 1.15; }
#dev { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 3px 0 2px; }
#dev label { display: flex; align-items: center; gap: 6px; min-width: 0; }
#dev select { max-width: 270px; min-width: 120px; background: var(--vu-track); color: var(--vu-text); border: 1px solid var(--vu-fill); border-radius: 6px; padding: 2px 4px; font: inherit; font-size: 12px; }
#dev select:focus-visible { outline: 3px solid #5eead4; outline-offset: 1px; }
button.off { text-decoration: none; }
/* ландшафт телефона: места по высоте мало */
@media (max-height: 520px) {
  header { padding: 4px 8px; } #title { font-size: 15px; } #sub { font-size: 12px; min-height: 14px; }
  #vu { padding: 2px 12px; } #vu .vw { min-height: 0; } #vu .vrow { margin: 0; }
  footer { padding: 4px 6px; } button { min-height: 32px; padding: 4px 6px; }
  #more { max-height: 72vh; } #av { width: 64px; height: 64px; font-size: 30px; } #phn { font-size: 16px; }
}
body.pip header, body.pip #dock, body.pip #warn, body.pip #lv, body.pip #rec, body.pip #peerRec, body.pip #toast { display: none !important; }
body.pip #av { width: 56px; height: 56px; font-size: 26px; } body.pip #phn { font-size: 13px; } body.pip #pht { display: none; } body.pip #ph { gap: 6px; padding: 6px; }
/* 7.6: широкий экран (ТВ, планшет, телефон в альбоме): картинка слева, колонка кнопок сбоку (справа или слева, настройка «Кнопки звонка») */
@media (orientation: landscape) and (min-width: 560px) {
  #wrap { flex-direction: row; } body.btnL #wrap { flex-direction: row-reverse; }
  #dock { flex: 0 0 300px; width: 300px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; background: var(--panel); }
  #vu { padding: 6px 8px 2px; } #vu .vrow { flex-wrap: wrap; gap: 2px 6px; } #vu .vl { flex: 1 0 100%; } #vu .vbar { flex: 1 1 0; } #vu .vn { flex: 0 0 auto; white-space: nowrap; text-align: right; } #vu .vw { padding-left: 0; }
  #mainRow { flex-direction: column; flex-wrap: nowrap; padding: 6px 8px; gap: 6px; }
  #mainRow button { flex: 0 0 auto; width: 100%; max-width: none; min-height: 40px; justify-content: flex-start; padding: 6px 12px; font-size: 14px; }
  #mainRow button svg { display: inline-block; }
  #more { position: static; display: none; max-height: none; box-shadow: none; border-top: 1px solid rgba(255,255,255,.1); }
  #more.open { display: block; } #more footer { padding: 6px 8px; } #more button { min-width: 0; flex: 1 1 40%; justify-content: center; }
  #more #capRow button.sm { flex: 0 0 auto; }
  #dev label { width: 100%; flex-direction: column; align-items: stretch; gap: 2px; text-align: left; } #dev select { width: 100%; max-width: none; }
}
@media (orientation: landscape) and (min-width: 560px) and (max-height: 520px) {
  #mainRow { display: grid; grid-template-columns: 1fr 1fr; } #mainRow button { min-height: 34px; padding: 4px 8px; font-size: 13px; } #mainRow button svg { display: none; }
  #dock { flex-basis: 330px; width: 330px; }
}
/* 7.6: «На весь экран»: только картинка (значки записи и всплывающее сообщение остаются) */
body.full header, body.full #dock, body.full #warn { display: none !important; }
/* 7.6: аватарки: у собеседника без видео крупно по центру (вписана, без растяжения), при видео маленькая у названия; режим «Картинка вместо видео» */
header { position: relative; }
#hav { display: none; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; background: center / cover no-repeat; border: 2px solid rgba(255,255,255,.6); }
#hav.on { display: block; }
#av.img { width: min(62vmin, 440px); height: min(62vmin, 440px); border-radius: 14%; background: center / cover no-repeat; font-size: 0; }
#ph.pic { background: #0b1514 center / contain no-repeat; }
#ph.pic #av, #ph.pic #phn { display: none; }
body.pip #av.img { width: min(78vmin, 100%); height: min(78vmin, 100%); } body.pip #ph.pic #pht, body.pip #av.img ~ #phn { display: none; }
</style>
</head>

<div id="wrap">
<main>

  <div id="rec" hidden></div><div id="peerRec" hidden></div>
  <video id="lv" class="off" autoplay playsinline muted poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>

<div id="vu" role="group">

</div>
<footer id="mainRow">
  <button id="bMic"></button>
  <button id="bSpk"></button>
  <button id="bCam"></button>
  <button id="bEnd" class="end"></button>
  <button id="bBg" class="more"></button>
  <button id="bPip" class="more" style="display:none"></button>
  <button id="bFull" class="more"></button>
  <button id="bMore" class="more"></button>
</footer>
<div id="more">
  <footer id="moreRow">
    <button id="bMir"></button>
    <button id="bRot"></button>
    <button id="bView"></button>
    <button id="bOth" style="display:none"></button>
  </footer>
  <footer class="cap" id="capRow">
    <button id="bShot"></button>
    <button id="bDirS" class="sm"></button>
    <button id="bRec"></button>
    <button id="bDirV" class="sm"></button>
    <button id="bRecA"></button>
    <button id="bDirA" class="sm"></button>
    <button id="bOpen" style="display:none"></button>
  </footer>
  <div id="dev"><label><span id="dlMic"></span><select id="selMic"></select></label><label><span id="dlSpk"></span><select id="selSpk"></select></label><label><span id="dlVq"></span><select id="selVq"></select></label><label><span id="dlRq"></span><select id="selRq"></select></label><label><span id="dlRf"></span><select id="selRf"></select></label></div>
</div>
</div>
</div>
<div id="toast" hidden></div>

  if (media.video) { rv.srcObject = new MediaStream([media.video]); rv.classList.add('live'); showPh(false); }
  if (media.audio) {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)(), an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(new MediaStream([media.audio])).connect(an);
      const buf = new Uint8Array(an.fftSize);
      timer = setInterval(() => { an.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128)); const n = Math.min(20, Math.round(m / 128 * 40)); $('sub').textContent = S.testSub.split(':')[0] + ':  ' + '█'.repeat(n) + '░'.repeat(20 - n); }, 120);
    } catch (e) { log('meter: ' + e); }
  }
  post({ type: 'state', v: 'preview', audio: !!media.audio, video: !!media.video });
}
async function tvoAnswer(packed) {
  try {
    await pc.setRemoteDescription({ type: 'answer', sdp: await unpack(packed) });
    $('sub').textContent = S.connecting;
    clearTimeout(failTimer); failTimer = setTimeout(() => { if (!connectedAt && !ended) finish('failed'); }, 30000);
  } catch (e) { log('answer: ' + e); finish('failed'); }
}
// 4.0: баннер «звук может задвоиться и будет писк» (программа удалённого доступа или другая программа с микрофоном); не блокирует звонок, закрывается крестиком;
// после закрытия тот же текст не возвращается, новый (список программ изменился) показывается снова
let warnDismissed = '';
function tvoWarn(text) {
  text = String(text || '');
  const box = $('warn');
  if (!text || text === warnDismissed) { box.hidden = true; if (!text) warnDismissed = ''; return; }
  $('warnTxt').textContent = text; box.hidden = false; log('warn shown'); vsLater();
}
$('warnX').onclick = () => { warnDismissed = $('warnTxt').textContent; $('warn').hidden = true; vsLater(); };
$('warnX').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('warnX').click(); } };
function tvoPeerSays(kind) {   // от хоста: ring / noRing / declined / busy / noAnswer / hangup
  if (kind === 'ring') { if (!connectedAt && !ended) { $('sub').textContent = S.ringing; $('pht').textContent = ''; } return; }
  if (kind === 'noRing') { if (!connectedAt && !ended) { $('pht').textContent = S.noRing; } return; }
  if (kind === 'declined') finish('declined'); else if (kind === 'busy') finish('busy'); else if (kind === 'noAnswer') finish('noAnswer'); else finish('gone');
}

// 4.1 (12.11.2026): гудок ожидания (ту-ту) у звонящего. Выбирается в окне «Мелодия звонка» (cfg.waitTone: w1..w4 или off; cfg.ringVol 0..100).
// Играет, пока на другом конце не ответили; замолкает при ответе, отказе, отмене и конце звонка; при выключенном «Динамике» не слышен; идёт на выбранные динамики.
let wtCtx = null, wtGain = null, wtTimer = null;
const WT_PERIOD = { w1: 5000, w2: 3500, w3: 4000, w4: 4000 };
function wtVol() { return spkOn ? Math.max(0, Math.min(1, (cfg.ringVol == null ? 70 : (cfg.ringVol | 0)) / 100)) : 0; }
function wtTone(ac, out, f, st, dur, amp) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(amp, st + 0.01); g.gain.setValueAtTime(amp, st + dur - 0.03); g.gain.linearRampToValueAtTime(0, st + dur);
  o.connect(g); g.connect(out); o.start(st); o.stop(st + dur + 0.05);
}
function wtBell(ac, out, f, st, dur, amp) {
  [[1, 1, 2.8], [2.76, 0.4, 6], [5.4, 0.18, 9]].forEach(p => {
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f * p[0];
    g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(amp * p[1], st + 0.004); g.gain.setTargetAtTime(0, st + 0.004, 1 / p[2]);
    o.connect(g); g.connect(out); o.start(st); o.stop(st + dur);
  });
}
function wtGlide(ac, out, f0, f1, st, dur, amp) {
  const o = ac.createOscillator(), g = ac.createGain(), n = 64, c = new Float32Array(n); o.frequency.setValueAtTime(f0, st); o.frequency.linearRampToValueAtTime(f1, st + dur);
  for (let i = 0; i < n; i++) c[i] = amp * Math.pow(Math.sin(Math.PI * i / (n - 1)), 2);
  g.gain.setValueCurveAtTime(c, st, dur); o.connect(g); g.connect(out); o.start(st); o.stop(st + dur + 0.05);
}
function wtCycle(ac, out, id, st) {
  if (id === 'w1') wtTone(ac, out, 425, st, 1.0, 0.6);
  else if (id === 'w2') { wtTone(ac, out, 425, st, 0.4, 0.6); wtTone(ac, out, 425, st + 0.6, 0.4, 0.6); }
  else if (id === 'w3') { wtBell(ac, out, 783.99, st, 1.5, 0.35); wtBell(ac, out, 987.77, st + 0.35, 1.5, 0.35); }
  else if (id === 'w4') wtGlide(ac, out, 350, 470, st, 1.4, 0.6);
}
async function wtStart() {
  const id = String(cfg.waitTone || 'w1');
  if (cfg.role !== 'caller' || (cfg.test && !cfg.waitTest) || !WT_PERIOD[id] || wtCtx || ended || connectedAt) return;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(); wtCtx = ac;
    try { const spk = LS.getItem('tvoSpkId'); if (spk && ac.setSinkId) await ac.setSinkId(spk); } catch (e) { }
    try { await ac.resume(); } catch (e) { }
    if (wtCtx !== ac) { try { ac.close(); } catch (e) { } return; }
    wtGain = ac.createGain(); wtGain.gain.value = wtVol(); wtGain.connect(ac.destination);
    const run = () => wtCycle(ac, wtGain, id, ac.currentTime + 0.05);
    run(); wtTimer = setInterval(run, WT_PERIOD[id]); log('гудок ожидания: ' + id + ', громкость ' + wtVol());
  } catch (e) { log('гудок ожидания: ' + e); }
}
function wtStop() { clearInterval(wtTimer); wtTimer = null; try { if (wtCtx) wtCtx.close(); } catch (e) { } wtCtx = null; wtGain = null; }
function wtMute() { if (wtGain) wtGain.gain.value = wtVol(); }

function stopAll() {
  clearInterval(liveTimer);
  try { wtStop(); } catch (e) { }
  try { recStop(); } catch (e) { }
  clearInterval(vqTimer); vuStop(); clearInterval(timer); clearInterval(statsTimer); clearInterval(diagTimer); clearTimeout(lostTimer); clearTimeout(failTimer);
  try { if (localStream) { if (localStream.audio) localStream.audio.stop(); if (localStream.video) localStream.video.stop(); } } catch (e) { }
  mirStop();
  try { if (dc && dc.readyState === 'open') dc.close(); } catch (e) { }
  try { if (pc) pc.close(); } catch (e) { }
}
function finish(why) {
  if (ended) return; ended = true; stopAll();
  const msg = { gone: S.gone, ended: S.ended, declined: S.declined, busy: S.busy, noAnswer: S.noAnswer, failed: S.failed }[why] || S.ended;
  $('title').textContent = S.title; $('sub').textContent = msg; showPh(true); $('pht').textContent = why === 'failed' ? S.failHint : (why === 'noAnswer' ? S.noAnswer : ''); $('lv').classList.add('off');
  $('rv').classList.remove('live'); $('rv').srcObject = null;
  ['bMic', 'bSpk', 'bCam', 'bMir', 'bRot', 'bOth', 'bView', 'bShot', 'bRec', 'bRecA', 'bDirS', 'bDirV', 'bDirA'].forEach(i => { const e = $(i); if (e) e.disabled = true; });
  post({ type: 'ended', why });
}
function userHangup() {
  if (ended) return;
  try { if (dc && dc.readyState === 'open') dc.send('bye'); } catch (e) { }
  post({ type: 'hangup' });
  setTimeout(() => finish('ended'), 120);
}

$('bMic').onclick = () => { micOn = !micOn; if (localStream && localStream.audio) localStream.audio.enabled = micOn; updBtns(); post({ type: 'ui', mic: micOn }); };
$('bSpk').onclick = () => { spkOn = !spkOn; if (!cfg.test && cfg.role !== 'preview') $('rv').muted = !spkOn; wtMute(); updBtns(); post({ type: 'ui', spk: spkOn }); };
$('bCam').onclick = async () => {
  if (cfg.role === 'preview') { if (!localStream || !localStream.video) return; camOn = !camOn; localStream.video.enabled = camOn; updBtns(); return; }
  if (camOn) {
    camOn = false;
    try { mirStop(); if (localStream && localStream.video) { localStream.video.stop(); } if (camSender) await camSender.replaceTrack(null); } catch (e) { }
    $('lv').classList.add('off');
  } else {
    try {
      const t = await getVideoTrack(); if (!localStream) localStream = { audio: null, video: null }; localStream.video = t;
      if (camSender) await camSender.replaceTrack(t);
      else { const tr = pc.getTransceivers().find(x => x.receiver.track.kind === 'video'); if (tr) { await tr.sender.replaceTrack(t); camSender = tr.sender; } }
      $('lv').srcObject = new MediaStream([t]); $('lv').classList.remove('off'); camOn = true;
      await applyOutgoing();
      if (camSender) setBitrate(camSender, vqKbps());
    } catch (e) { log('cam2: ' + e.name); $('pht').textContent = S.noCam; }
  }
  updBtns(); post({ type: 'ui', cam: camOn });
};
$('bMir').onclick = () => { mirMode = mirMode === 'on' ? 'off' : (mirMode === 'off' ? 'all' : 'on'); try { LS.setItem('tvoMirror', mirMode); } catch (e) { } updBtns(); applyMirror(); post({ type: 'ui', mir: mirMode }); };
$('bRot').onclick = () => { rotDeg = (rotDeg + 90) % 360; updBtns(); applyRot(); post({ type: 'ui', rot: rotDeg }); };
$('bOth').onclick = () => { post({ type: 'others', on: othState !== 1 }); };
$('selMic').onchange = e => { if (e.target.value) pickMic(e.target.value); };
$('selSpk').onchange = e => { post({ type: 'output', id: e.target.value }); log('выход звука: ' + (e.target.selectedOptions[0] ? e.target.selectedOptions[0].textContent : '')); };
$('bView').onclick = () => {
  if (viewMode === 'fit') { viewMode = 'fill'; try { LS.setItem('tvoView', 'fill'); } catch (e) { } applyView(); updBtns(); }
  else { viewMode = 'fit'; try { LS.setItem('tvoView', 'fit'); } catch (e) { } applyView(); viewFlash = 1; updBtns(); post({ type: 'fitwin' }); setTimeout(() => { viewFlash = 0; updBtns(); }, 1600); }
};
$('bShot').onclick = takeShot;
$('bRec').onclick = () => { if (rec && rec.kind === 'av') recStop(); else startRec('av'); };
$('bRecA').onclick = () => { if (rec && rec.kind === 'a') recStop(); else startRec('a'); };
$('bOpen').onclick = () => post({ type: 'openfolder', t: recLastType });
$('selVq').onchange = e => setVq(e.target.value);
$('selRq').onchange = e => setRq(e.target.value);
$('selRf').onchange = e => setRf(e.target.value);
$('bDirS').onclick = () => post({ type: 'pickdir', t: 'shot' });
$('bDirV').onclick = () => post({ type: 'pickdir', t: 'video' });
$('bDirA').onclick = () => post({ type: 'pickdir', t: 'audio' });
$('bEnd').onclick = userHangup;
$('bBg').onclick = () => post({ type: 'bg' });
// сторона колонки кнопок на широком экране берётся из «Настроек» программы («Панели управления»: справа или слева), меняется и во время звонка
window.tvoSetSide = v => document.body.classList.toggle('btnL', v === 'left');
// «На весь экран»: видео без кнопок и подписей; вернуть кнопки можно любой клавишей пульта, касанием или щелчком; «Назад» сначала выходит отсюда
let fullAt = 0;
function setFull(on) {
  on = !!on; if (document.body.classList.contains('full') === on) return;
  document.body.classList.toggle('full', on); fullAt = Date.now(); post({ type: 'full', on });
  if (!on) setTimeout(() => { try { $('bFull').focus({ preventScroll: true }); } catch (e) { } tvoSendSize(true); }, 60); else { try { document.activeElement.blur(); } catch (e) { } setTimeout(() => tvoSendSize(true), 120); }
}
window.tvoFull = setFull;
$('bFull').onclick = () => setFull(true);
['keydown', 'mousedown', 'touchstart', 'click'].forEach(ev => document.addEventListener(ev, e => { if (document.body.classList.contains('full') && Date.now() - fullAt > 450) { setFull(false); e.preventDefault(); e.stopPropagation(); } }, true));
$('bPip').onclick = () => post({ type: 'pip' });
// «картинка в картинке»: в маленьком окошке только картинка собеседника (или значок) без кнопок и шкал
window.tvoPip = on => { document.body.classList.toggle('pip', !!on); setTimeout(() => { if (rotDeg % 180) applyRot(); tvoSendSize(true); }, 200); };
$('bMore').onclick = () => { $('more').classList.toggle('open'); updBtns(); setTimeout(() => tvoSendSize(false), 120); };
window.addEventListener('beforeunload', () => { if (!ended) { try { if (dc && dc.readyState === 'open') dc.send('bye'); } catch (e) { } } });

// снимок удалённой картинки (для проверок): PNG в сообщении хосту
window.tvoSnap = function () {
  try {
    const v = $('rv'); const c = document.createElement('canvas'); c.width = v.videoWidth || 2; c.height = v.videoHeight || 2; c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    post({ type: 'snap', w: c.width, h: c.height, png: c.toDataURL('image/png').split(',')[1] });
  } catch (e) { log('snap: ' + e); }
};
window.tvoOthersState = tvoOthersState; window.tvoWarn = tvoWarn; window.tvoStart = tvoStart; window.tvoAnswer = tvoAnswer; window.tvoPeerSays = tvoPeerSays; window.tvoHangup = userHangup;
post({ type: 'ready' });
</script>
