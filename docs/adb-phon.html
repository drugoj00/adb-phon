var I18N = {"en": {"name": "ADB-phon", "title": "ADB-phon: Free ADB manager right on your phone (free)", "h1": "ADB manager right on your phone", "lead": "Free ADB manager right on your phone: install APKs over ADB, air mouse and remote control, special access that survives a reboot. No computer needed, root is optional (with root even ADB is not needed).", "dl": "Download APK", "gh": "View on GitHub", "back": "All our programs", "dlnote": "Current version: 7.0. ADB-phon-7.0.apk. Free, no ads. Android 8.0 and newer. Interface in English, Ukrainian and Russian.", "f_h": "Features", "s_h": "Screenshots", "st_h": "Quick start", "instr": "Full user guide for every feature (GitHub)", "lm_h": "Limitations and warnings", "d_h": "Support the project", "d_p": "The app is free. If it is useful you can support its development by card, Google Pay or USDT. For USDT use only the TRON network (TRC20): coins sent over another network are lost.", "d_btn": "Donation options", "c1": "ADB-phon connects to the ADB of the same phone (or of another device in your network) and runs commands with shell rights, as if the phone were plugged into a computer.", "feats": [["What's new in 7.0", "Shizuku compatibility: apps that support Shizuku get shell permissions through ADB-phon • Dynamic colors from the wallpaper and a choice of the main color • Font size and element size • Full screen mode • Custom icons: folders, files, drives and places, apps, tabs, side panel buttons • Side panel buttons in Files: hide and restore • List and tree on the Files root screen, folder colors • Console: live terminal, history, Ctrl+C, Tab, My commands • Devices in Files: computers and Android devices in one group, each with Files and Video window folders • Video window: view and control the screen of a computer or another Android, auto-rotation, text input in any language • Video call between Android devices and computers: incoming call window, sound, speaker, camera • Invitations: join a Tailscale network by an invitation from a PC • Another VPN is turned off for the duration of a session and restored afterwards • A hint about ADB-phon Bridge in the Gamepad section • Fixed APK installation and file operations with Cyrillic and other non-Latin names"], ["Install APK over ADB", "Install or update apps through ADB, no computer needed. Sources: a file, a folder, an archive (ZIP, 7z, RAR, TAR), the built-in file manager (including USB drives through ADB), network folders (SMB), files sent over Wi-Fi from a browser, search on the internet (F-Droid, GitHub, a link). Multi-part packages APKS, APKM, XAPK and ZIP with APK and OBB: the parts for your phone are picked automatically. Batch install."], ["Air mouse and mouse", "The phone’s gyroscope works as a pointer. A real cursor appears on the screen of the controlled device (a helper creates a virtual mouse). The “Air” button works in two modes picked with a round switch: tap to turn on and tap again to turn off, or hold it while you move the phone. Click, scroll, OK, Back, Home, Menu, arrows, volume, sound and microphone on/off. Touch mode is instant too: the helper injects real touches, so taps and swipes work even on slow TV boxes."], ["Special access, survives reboot", "Turn on an accessibility service, keep it enabled after a reboot (Android 13–14 often switch it off), remove “restricted settings”, allow writing secure settings, draw over other apps, notifications, usage stats, all files, install unknown apps, no battery limits."], ["Remote control", "Four switchable modes: Keys, Swipe, Mouse, Air. Home, Back, Menu, D-pad and OK, volume, media keys, power, recents, text input. Swipes act as arrow keys, tap is OK, scroll buttons. Keys are instant. For phones, TVs and set-top boxes."], ["SSH", "Connect to a computer or server over SSH (Linux, macOS, Windows with an SSH server): terminal and files over SFTP (browse, download, upload, delete). Login with a password or a key file; the server key is remembered on first connect."], ["PC mouse", "The phone works as a Bluetooth mouse and keyboard for a computer, laptop, tablet, iPhone or TV (Android 9+): touch pad, clicks, scroll, Enter, Esc, arrows, Win, Ctrl+C/V, text input. Nothing to install on the computer."], ["Easy connection", "Finds devices in the network and shows their names, favourites with your own names, manual IP. Android 11+: automatic pairing without typing a code (an accessibility service reads the code from the system window) or pairing by code. Android 8–10: one command from a computer once, then the app connects by itself. Control another device by IP; press and hold a device to disconnect."], ["Apps", "Icons, search, filters (user, system, junk, disabled, removed), disable and enable, uninstall and restore, stop, clear data, save APK, permission switches, batch actions (including batch uninstall), protection of critical packages, “Clean RAM” button."], ["Cleaner for junk apps", "The “Junk” filter shows well-known unneeded system apps (Samsung, Google, Microsoft, Facebook services, partner apps) with marks “safe” and “careful”. “Select safe” and disable them; it is reversible (Disabled, then Enable)."], ["Copies and versions", "Before an app is uninstalled its APK is saved. The “Versions” button installs any version, including an older one, from saved copies, from F-Droid or from your own file."], ["Backup with data", "A copy of any app together with its data, and restore. With root all data is saved; over ADB only what the system allows (external data and, for apps that allow it, internal data on Android 10 and older). The program taps the system confirmation window itself."], ["Safe launcher disabling", "The only home screen cannot be disabled or deleted by mistake: if there is no spare one, the program offers to download App Menu from GitHub and installs it in one tap (internet needed)."], ["Updates", "Checks GitHub for a new version on request and offers to update in one tap; in Settings you can switch on an automatic check once a day (off by default)."], ["Files", "Two-panel file manager: phone memory, memory card, USB drives, archives (ZIP, 7z, RAR, TAR), Android/data over ADB, network folders and cloud drives in one tree. Create, rename, copy, move, delete, ZIP, text files, built-in editor, selection by mask, drag and drop between panels, a recycle bin for the phone, card, clouds and network folders, and a “File already exists” window (Rename, Replace, Cancel, Apply to all). After a restart folders and places come back."], ["Cloud drives", "Google Drive, MEGA, Dropbox, OneDrive, Yandex Disk, Box, pCloud and dozens of other services. Clouds work through a separate free module, “ADB-phon Clouds”, offered for download once when you add a cloud; the downloaded file deletes itself after installation. You sign in in the browser; if the shared key of the app is busy, the “Own key” wizard walks you through creating your own key, step by step."], ["Network folders", "SMB, SFTP, FTP, FTPS and WebDAV: browse, copy and move in both directions, also directly between two network sources or from a cloud to the network. A file is written safely: the original survives a failure or cancel."], ["Gamepad", "The phone as a gamepad for a PC over Bluetooth (vibration from the PC) and an on-screen gamepad, “Play on this phone” (prototype): sticks, A/B/X/Y, triggers, Back, Guide and Start over any game; layout, dead zone, size and transparency can be changed."], ["Phone", "Device info, monitor, screenshot, screen recording, clear all caches, quick settings (dark mode, Wi-Fi, data, Bluetooth, rotation, font, screen timeout, show touches, animations, DPI), reboot (normal, recovery, bootloader)."], ["Devices and Video window", "The Files tree has one “Devices” group: computers and Android devices together, each with Files and Video window folders. Video window shows and controls the screen of a computer or another Android device: auto-rotation, text input in any language."], ["Video call", "Video call between Android devices and computers (the Windows program “Phone in Window with Sound” 3.0). How to call: open Connection → Video calls, tap “Add person…”, enter a name and the code of their program (XXXX-XXXX-XXXX; it is shown in the other program: on Windows in “Connection over the internet”, on Android in this same section), then tap “Call”. The other person sees the “Calling…” window; the camera and microphone turn on only when they tap “Answer”. During the call: Sound, Speaker, Camera, End. Receiving calls is on by default (a small icon in the notification shade); the switch is in the same section."], ["Invitations", "Join a Tailscale network by an invitation from a PC. Another VPN is turned off for the duration of a session and restored afterwards."], ["Shizuku compatibility", "Apps that support Shizuku get shell permissions through ADB-phon."], ["Console", "Live terminal: any shell command, history, Ctrl+C, Tab, “My commands”."], ["Settings", "Theme (auto, light, dark), dynamic colors from the wallpaper and the main color, font size and element size, full screen mode, custom icons for folders, files, drives, apps and side panel buttons, language (English, Ukrainian, Russian), keep screen on, bug log, backup and restore of settings to a folder you choose, install any version of the program from GitHub."], ["Free", "No ads, open source."]], "steps": ["Download ADB-phon-7.0.apk and install it (allow installing from this source if Android asks).", "Android 11 and newer: Settings, Developer options, turn on “Wireless debugging”, tap “Pair device with pairing code”. Open ADB-phon in split screen or a floating window, enter the port and the code, tap “Pair”, then “Connect”.", "Android 8–10: once, from a computer with USB debugging, run adb tcpip 5555. In ADB-phon tap “Connect” and allow debugging on the phone.", "For another device (TV, second phone) tap it in the “Devices in the network” list or type its IP."], "lims": ["Actions on system apps can break the phone: be careful, the app asks for confirmation and protects critical packages.", "ADB-phon works locally and sends nothing anywhere. The cursor helper and the remote control manage a whole device: connect only to your own devices.", "The app is not on Google Play (it would not be allowed): download the APK here. Android may warn about installing from an unknown source.", "Tested on three phones (Android 10 and 15) and TV boxes (Android 9, 11, 12). Not yet tested on Android 8 and on x86 devices; reports are welcome.", "Cloud drives need the separate module “ADB-phon Clouds” (one download, internet needed). Google Drive: the app’s shared key is a trial one (first 100 users); then create your own key in the app. RAR5 archives are supported (also with a password). FTPS: browsing and downloading are tested, uploading only partly.", "SSH and “PC mouse” are new and tested only partly: SSH against OpenSSH for Windows up to the password step, the Bluetooth mouse is not on every phone (some firmwares switch the HID profile off).", "Special access settings can differ on Xiaomi, Huawei and other firmwares; on Xiaomi also turn on “USB debugging (security settings)”.", "Video window at a Tailscale address (100.x) works when both devices are in the Tailscale network (with another permanent VPN on the phone, use the address of that network). Text input in the Video window in any layout needs ADB-phon 7.0 or newer on the target device."], "smart": "The APK is signed but is not on Google Play, so Android may ask you to allow installing from this source. The SHA-256 checksum is in the release description.", "note": "ADB-phon is an independent project, not related to Google. Android is a trademark of Google LLC.", "f_rel": "All versions", "f_issue": "Report a problem", "f_src": "Source on GitHub", "f_contacts": "Contacts", "f_terms": "Terms and conditions", "f_refund": "Refund policy", "f_oferta": "Public offer", "star_btn": "⭐ Star on GitHub", "star_p": "A free way to help: put a star on the GitHub repository. It costs nothing and helps other people find the program.", "cap_v7_1": "Files: the “Devices” group for computers and Android devices (“Add device…”).", "cap_v7_2": "Settings: theme, language, font size, element size, full screen mode.", "cap_v5_1": "Files: two panels, buttons on the right (Up, Refresh, Copy, Move, Delete, Rename, New folder, Text file, ZIP, Select all) and the tab bar with “Exit”.", "cap_v5_2": "The “home” tree: storage, recycle bin, network, cloud drives and their recycle bins in one place.", "cap_v5_3": "Recycle bin of a cloud: select items and use the bottom bar “Restore” and “Delete forever”.", "cap_v5_4": "The “File already exists” window: Rename, Replace, Cancel.", "cap_v5_5": "Gamepad: “Play”, “Play on this phone”, test, layout, dead zone, size and transparency.", "cap_v5_6": "On-screen gamepad over a game: sticks, A/B/X/Y, triggers and bumpers, Back, Guide, Start.", "cap_v5_7": "The “Own key” wizard: one short step at a time, the texts are put on the clipboard for you.", "cap_v5_8": "The cloud module is offered once, when you add a cloud."}, "ru": {"name": "ADB-phon", "title": "ADB-phon: Бесплатный ADB-менеджер прямо на телефоне (бесплатно)", "h1": "ADB-менеджер прямо на телефоне", "lead": "Бесплатный ADB-менеджер прямо на телефоне: установка APK по ADB, аэромышь и пульт, особые права, которые переживают перезагрузку. Без компьютера, root не обязателен (с root не нужен даже ADB).", "dl": "Скачать APK", "gh": "Смотреть на GitHub", "back": "Все наши программы", "dlnote": "Текущая версия: 7.0. ADB-phon-7.0.apk. Бесплатно, без рекламы. Android 8.0 и новее. Интерфейс на русском, украинском и английском.", "f_h": "Возможности", "s_h": "Скриншоты", "st_h": "Быстрый старт", "instr": "Полная инструкция по всем функциям (GitHub)", "lm_h": "Ограничения и предупреждения", "d_h": "Поддержать проект", "d_p": "Программа бесплатная. Если она вам полезна, можно поддержать разработку банковской картой, Google Pay или USDT. Для USDT только сеть TRON (TRC20): монеты, отправленные по другой сети, теряются.", "d_btn": "Способы поддержки", "c1": "ADB-phon подключается к ADB этого же телефона (или другого устройства в сети) и выполняет команды с правами оболочки, как будто телефон подключён к компьютеру.", "feats": [["Что нового в 7.0", "Совместимость с Shizuku: приложения с поддержкой Shizuku получают права shell через ADB-phon • Динамические цвета из обоев и выбор основного цвета • Размер шрифта и размер элементов • Режим «Во весь экран» • Свои значки: папки, файлы, диски и места, приложения, вкладки, кнопки боковой панели • Кнопки боковой панели «Файлов»: убрать и вернуть • Список и дерево на корневом экране «Файлов», цвет папок • Консоль: живой терминал, история, Ctrl+C, Tab, «Мои команды» • «Устройства» в «Файлах»: компьютеры и Android-устройства в одной группе, у каждого папки «Файлы» и «Видеоокно» • «Видеоокно»: просмотр и управление экраном компьютера или другого Android, автоповорот, ввод текста на любом языке • Видеозвонок между Android-устройствами и компьютерами: окно «Звонит…», звук, динамик, камера • Приглашения: подключение к сети Tailscale по приглашению с ПК • Другой VPN отключается на время сеанса связи и возвращается как был • Подсказка про ADB-phon Мост в разделе «Геймпад» • Исправлена установка APK и работа с файлами при русских и других не-латинских именах"], ["Установка APK по ADB", "Установка и обновление приложений через ADB, компьютер не нужен. Источники: файл, папка, архив (ZIP, 7z, RAR, TAR), встроенный файловый менеджер (в том числе флешки через ADB), сетевые папки (SMB), приём файлов по Wi‑Fi из браузера, поиск в интернете (F-Droid, GitHub, ссылка). Пакеты из нескольких частей APKS, APKM, XAPK и ZIP с APK и OBB: нужные части для вашего телефона выбираются сами. Пакетная установка."], ["Аэромышь и мышь", "Гироскоп телефона работает как указка. На экране управляемого устройства появляется настоящий курсор (помощник создаёт виртуальную мышь). Кнопка «Воздух» работает в двух режимах, которые выбираются круглым переключателем: коснуться, чтобы включить, и ещё раз, чтобы выключить, либо держать, пока водишь телефоном. Клик, прокрутка, ОК, Назад, Домой, Меню, стрелки, громкость, звук и микрофон вкл/выкл. Касание тоже мгновенное: помощник отправляет настоящие касания, поэтому тапы и свайпы работают даже на слабых ТВ-приставках."], ["Особые права, переживают перезагрузку", "Включение службы спецвозможностей, удержание её после перезагрузки (на Android 13–14 она часто выключается сама), снятие «ограниченных настроек», запись защищённых настроек, поверх других окон, уведомления, статистика, все файлы, установка из неизвестных источников, без ограничений батареи."], ["Пульт", "Четыре режима переключателем: Кнопки, Свайп, Мышь, Воздух. Домой, назад, меню, крестовина и ОК, громкость, медиа-кнопки, питание, недавние, ввод текста. Свайпы = стрелки, касание = ОК, кнопки прокрутки. Кнопки срабатывают мгновенно. Для телефонов, телевизоров и приставок."], ["SSH", "Подключение к компьютеру или серверу по SSH (Linux, macOS, Windows с SSH-сервером): терминал и файлы по SFTP (просмотр, скачать, загрузить, удалить). Вход по паролю или файлу ключа; ключ сервера запоминается при первом подключении."], ["Мышь ПК", "Телефон работает как Bluetooth-мышь и клавиатура для компьютера, ноутбука, планшета, iPhone или телевизора (Android 9+): тачпад, клики, прокрутка, Enter, Esc, стрелки, Win, Ctrl+C/V, ввод текста. На компьютер ничего ставить не нужно."], ["Простое подключение", "Автопоиск устройств в сети с именами, избранные с вашими названиями, ручной ввод IP. Android 11+: автоматическое сопряжение без ввода кода (служба спецвозможностей сама читает код в системном окне) или сопряжение по коду. Android 8–10: один раз команда с компьютера, дальше программа подключается сама. Управление другим устройством по IP; долгое нажатие на устройство отключает его."], ["Приложения", "Значки, поиск, фильтры (мои, системные, мусор, отключённые, удалённые), отключить и включить, удалить и восстановить, остановить, очистить данные, сохранить APK, разрешения переключателями, пакетные действия (в том числе пакетное удаление), защита критичных пакетов, кнопка «Очистить ОЗУ»."], ["Чистильщик лишнего", "Фильтр «Мусор» показывает известные ненужные системные приложения (Samsung, Google, Microsoft, службы Facebook, партнёрские) с метками «безопасно» и «осторожно». «Выбрать безопасные» и отключить; это обратимо («Отключённые» → «Включить»)."], ["Копии и версии", "Перед удалением приложения его APK сохраняется. Кнопка «Версии» ставит любую версию, в том числе старую, из сохранённых копий, из F-Droid или из своего файла."], ["Копия с данными", "Копия любого приложения вместе с его данными и восстановление. С root сохраняются все данные, по ADB только то, что разрешает система (внешние данные и, если приложение разрешает, внутренние на Android 10 и старше). Системное окно подтверждения программа нажимает сама."], ["Защита главного экрана", "Единственный главный экран нельзя отключить или удалить по ошибке: если запасного нет, программа предлагает скачать «Меню приложений» с GitHub и ставит его одним нажатием (нужен интернет)."], ["Обновления", "Проверяет GitHub на новую версию по кнопке и предлагает обновиться одним нажатием; в настройках можно включить автоматическую проверку раз в сутки (по умолчанию выключена)."], ["Файлы", "Двухпанельный файловый менеджер: память телефона, карта памяти, USB-накопители, архивы (ZIP, 7z, RAR, TAR), Android/data по ADB, сетевые папки и облачные диски в одном дереве. Создать, переименовать, копировать, переместить, удалить, ZIP, текстовые файлы, встроенный редактор, выбор по маске, перетаскивание между панелями, корзина для телефона, карты, облаков и сетевых папок, окно «Файл уже существует» («Переименовать», «Заменить», «Отменить», «Применить ко всем»). После перезапуска возвращаются папки и места."], ["Облачные диски", "Google Диск, MEGA, Dropbox, OneDrive, Яндекс Диск, Box, pCloud и десятки других сервисов. Облака работают через отдельный бесплатный модуль «ADB-phon Облака»: его предлагается скачать один раз, когда добавляется облако; скачанный файл после установки удаляется сам. Вход в браузере; если общий ключ программы занят, мастер «Свой ключ» по шагам поможет создать собственный."], ["Сетевые папки", "SMB, SFTP, FTP, FTPS и WebDAV: просмотр, копирование и перенос в обе стороны, в том числе напрямую между двумя сетевыми источниками и из облака в сеть. Файл пишется безопасно: оригинал не пропадает при сбое или отмене."], ["Геймпад", "Телефон как геймпад для ПК по Bluetooth (вибрация с ПК) и экранный геймпад «Играть на этом телефоне» (прототип): стики, A/B/X/Y, курки, Back, Guide и Start поверх любой игры; раскладку, мёртвую зону, размер и прозрачность можно менять."], ["Телефон", "Сведения об устройстве, мониторинг, снимок и запись экрана, очистка кэша всех приложений, быстрые настройки (тёмная тема, Wi-Fi, данные, Bluetooth, автоповорот, шрифт, гашение экрана, показ касаний, анимации, DPI), перезагрузка (обычная, recovery, загрузчик)."], ["Устройства и Видеоокно", "В дереве «Файлов» одна группа «Устройства»: компьютеры и Android-устройства вместе, у каждого папки «Файлы» и «Видеоокно». «Видеоокно» показывает экран компьютера или другого Android и управляет им: автоповорот, ввод текста на любом языке."], ["Видеозвонок", "Видеозвонок между Android-устройствами и компьютерами (Windows-программа «Телефон в окне со звуком» 3.0). Как позвонить: откройте «Связь → Видеозвонки», нажмите «Добавить человека…», впишите имя и код его программы (XXXX-XXXX-XXXX; код есть в программе собеседника: на Windows в «Связи по интернету», на Android в этом же разделе), затем «Позвонить». У собеседника появится окно «Звонит…»; камера и микрофон включаются, только когда он нажмёт «Ответить». В звонке кнопки «Звук», «Динамик», «Камера», «Завершить». Приём звонков включён по умолчанию (значок в шторке), выключатель в том же разделе."], ["Приглашения", "Подключение к сети Tailscale по приглашению с ПК. Другой VPN отключается на время сеанса связи и возвращается как был."], ["Совместимость с Shizuku", "Приложения с поддержкой Shizuku получают права shell через ADB-phon."], ["Консоль", "Живой терминал: любые команды оболочки, история, Ctrl+C, Tab, «Мои команды»."], ["Настройки", "Тема (авто, светлая, тёмная), динамические цвета из обоев и основной цвет, размер шрифта и элементов, режим «Во весь экран», свои значки папок, файлов, дисков, приложений и кнопок боковой панели, язык (русский, украинский, английский), держать экран включённым, журнал для поиска ошибок, резервная копия и восстановление настроек в выбранную папку, установка любой версии программы с GitHub."], ["Бесплатно", "Без рекламы, исходный код открыт."]], "steps": ["Скачайте ADB-phon-7.0.apk и установите его (если Android спросит, разрешите установку из этого источника).", "Android 11 и новее: «Настройки» → «Для разработчиков» → включите «Беспроводная отладка» → «Подключение устройства с помощью кода». Откройте ADB-phon в разделённом экране или плавающем окне, введите порт и код, нажмите «Сопряжение», затем «Подключиться».", "Android 8–10: один раз с компьютера по USB выполните adb tcpip 5555. В ADB-phon нажмите «Подключиться» и разрешите отладку на телефоне.", "Для другого устройства (телевизор, второй телефон) нажмите его в списке «Устройства в сети» или введите IP."], "lims": ["Действия над системными приложениями могут сломать телефон: будьте осторожны, программа просит подтверждение и защищает критичные пакеты.", "ADB-phon работает локально и никуда ничего не отправляет. Помощник с курсором и пульт управляют устройством целиком: подключайтесь только к своим устройствам.", "В Google Play программы нет (такое там не разрешено): скачивайте APK здесь. Android может предупредить об установке из неизвестного источника.", "Проверено на трёх телефонах (Android 10 и 15) и ТВ-приставках (Android 9, 11, 12). На Android 8 и на устройствах x86 пока не проверялось, отзывы приветствуются.", "Для облачных дисков нужен отдельный модуль «ADB-phon Облака» (скачивается один раз, нужен интернет). Google Диск: общий ключ программы пробный (первые 100 пользователей), дальше создайте свой ключ в программе. Архивы RAR5 поддерживаются (в том числе с паролем). FTPS: просмотр и скачивание проверены, загрузка только частично.", "SSH и «Мышь ПК» новые и проверены частично: SSH проверен на совместимость с OpenSSH для Windows до этапа пароля; Bluetooth-мышь есть не на всех телефонах (часть прошивок выключает профиль HID).", "Особые права на Xiaomi, Huawei и других прошивках могут отличаться; на Xiaomi включите ещё «Отладка по USB (настройки безопасности)».", "Видеоокно по адресу Tailscale (100.x) работает, если оба устройства в сети Tailscale (при постоянном другом VPN на телефоне нужен адрес той же сети). Ввод текста в Видеоокне любой раскладкой требует ADB-phon 7.0 или новее на целевом устройстве."], "smart": "APK подписан, но его нет в Google Play, поэтому Android может попросить разрешить установку из этого источника. Контрольная сумма SHA-256 указана в описании релиза.", "note": "ADB-phon: независимый проект, не связан с Google. Android — торговая марка Google LLC.", "f_rel": "Все версии", "f_issue": "Сообщить о проблеме", "f_src": "Код на GitHub", "f_contacts": "Контакты", "f_terms": "Правила и условия", "f_refund": "Правила возврата средств", "f_oferta": "Публичный договор", "star_btn": "⭐ Звезда на GitHub", "star_p": "Бесплатный способ помочь: поставьте звезду репозиторию на GitHub. Это ничего не стоит и помогает другим найти программу.", "cap_v7_1": "Файлы: группа «Устройства» для компьютеров и Android-устройств («Добавить устройство…»).", "cap_v7_2": "Настройки: тема, язык, размер шрифта и элементов, режим «Во весь экран».", "cap_v5_1": "Дерево «домика»: память, карта, корзина, сеть и облачные диски в одном месте.", "cap_v5_2": "Две панели рядом (альбомная раскладка): архивы и видео слева, папка резерва справа.", "cap_v5_3": "Перетаскивание между панелями: файл тянется на папку соседней панели, подсказка «отпусти над…».", "cap_v5_4": "Просмотр фото прямо в программе: листание, масштаб, слайд-шоу.", "cap_v5_5": "Встроенный видеоплеер.", "cap_v5_6": "Музыкальный плеер с мини-плеером поверх списка файлов.", "cap_v5_7": "Добавление облака: Google Диск, MEGA, Dropbox, OneDrive, Яндекс Диск и другие сервисы.", "cap_v5_8": "Экранный геймпад «Играть на этом телефоне»: стики, A/B/X/Y, курки, раскладка Xbox."}, "uk": {"name": "ADB-phon", "title": "ADB-phon: Безкоштовний ADB-менеджер прямо на телефоні (безкоштовно)", "h1": "ADB-менеджер прямо на телефоні", "lead": "Безкоштовний ADB-менеджер прямо на телефоні: встановлення APK через ADB, аеромиша й пульт, особливі права, що переживають перезавантаження. Без комп’ютера, root не обов’язковий (з root не потрібен навіть ADB).", "dl": "Завантажити APK", "gh": "Дивитися на GitHub", "back": "Усі наші програми", "dlnote": "Поточна версія: 7.0. ADB-phon-7.0.apk. Безкоштовно, без реклами. Android 8.0 і новіше. Інтерфейс українською, російською та англійською.", "f_h": "Можливості", "s_h": "Скриншоти", "st_h": "Швидкий старт", "instr": "Повна інструкція до всіх функцій (GitHub)", "lm_h": "Обмеження та попередження", "d_h": "Підтримати проєкт", "d_p": "Програма безкоштовна. Якщо вона вам корисна, можна підтримати розробку банківською карткою, Google Pay або USDT. Для USDT лише мережа TRON (TRC20): монети, надіслані іншою мережею, втрачаються.", "d_btn": "Способи підтримки", "c1": "ADB-phon підключається до ADB цього ж телефона (або іншого пристрою в мережі) і виконує команди з правами оболонки, наче телефон підключено до комп’ютера.", "feats": [["Що нового в 7.0", "Сумісність із Shizuku: застосунки з підтримкою Shizuku отримують права shell через ADB-phon • Динамічні кольори з шпалер і вибір основного кольору • Розмір шрифту та розмір елементів • Режим «На весь екран» • Власні значки: теки, файли, диски та місця, застосунки, вкладки, кнопки бічної панелі • Кнопки бічної панелі «Файлів»: прибрати й повернути • Список і дерево на кореневому екрані «Файлів», колір тек • Консоль: живий термінал, історія, Ctrl+C, Tab, «Мої команди» • «Пристрої» у «Файлах»: комп'ютери й Android-пристрої в одній групі, у кожного теки «Файли» та «Відеовікно» • «Відеовікно»: перегляд і керування екраном комп'ютера або іншого Android, автоповорот, введення тексту будь-якою мовою • Відеодзвінок між Android-пристроями та комп'ютерами: вікно «Дзвонить…», звук, динамік, камера • Запрошення: підключення до мережі Tailscale за запрошенням із ПК • Інший VPN вимикається на час сеансу звʼязку й повертається як був • Підказка про ADB-phon Міст у розділі «Геймпад» • Виправлено встановлення APK і роботу з файлами за українських та інших не латинських імен"], ["Встановлення APK через ADB", "Встановлення й оновлення застосунків через ADB, комп’ютер не потрібен. Джерела: файл, тека, архів (ZIP, 7z, RAR, TAR), вбудований файловий менеджер (зокрема флешки через ADB), мережеві теки (SMB), приймання файлів по Wi‑Fi з браузера, пошук в інтернеті (F-Droid, GitHub, посилання). Пакети з кількох частин APKS, APKM, XAPK і ZIP з APK та OBB: потрібні частини для вашого телефона обираються самі. Пакетне встановлення."], ["Аеромиша та миша", "Гіроскоп телефона працює як указка. На екрані керованого пристрою з’являється справжній курсор (помічник створює віртуальну мишу). Кнопка «Повітря» працює у двох режимах, які обираються круглим перемикачем: торкнутися, щоб увімкнути, і ще раз, щоб вимкнути, або тримати, поки водиш телефоном. Клік, прокручування, ОК, Назад, Додому, Меню, стрілки, гучність, звук і мікрофон увімк/вимк. Дотик теж миттєвий: помічник надсилає справжні дотики, тому тапи й свайпи працюють навіть на слабких ТВ-приставках."], ["Особливі права, переживають перезавантаження", "Увімкнення служби спецможливостей, утримання її після перезавантаження (на Android 13–14 вона часто вимикається сама), зняття «обмежених налаштувань», запис захищених налаштувань, поверх інших вікон, сповіщення, статистика, усі файли, встановлення з невідомих джерел, без обмежень батареї."], ["Пульт", "Чотири режими перемикачем: Кнопки, Свайп, Миша, Повітря. Додому, назад, меню, хрестовина й ОК, гучність, медіа-кнопки, живлення, останні, введення тексту. Свайпи = стрілки, дотик = ОК, кнопки прокручування. Кнопки спрацьовують миттєво. Для телефонів, телевізорів і приставок."], ["SSH", "Підключення до комп’ютера або сервера по SSH (Linux, macOS, Windows із SSH-сервером): термінал і файли по SFTP (перегляд, завантажити, вивантажити, видалити). Вхід за паролем або файлом ключа; ключ сервера запам’ятовується під час першого підключення."], ["Миша ПК", "Телефон працює як Bluetooth-миша й клавіатура для комп’ютера, ноутбука, планшета, iPhone або телевізора (Android 9+): тачпад, кліки, прокручування, Enter, Esc, стрілки, Win, Ctrl+C/V, введення тексту. На комп’ютер нічого ставити не потрібно."], ["Просте підключення", "Автопошук пристроїв у мережі з іменами, обрані з вашими назвами, ручне введення IP. Android 11+: автоматичне сполучення без введення коду (служба спецможливостей сама читає код у системному вікні) або сполучення за кодом. Android 8–10: один раз команда з комп’ютера, далі програма підключається сама. Керування іншим пристроєм за IP; довге натискання на пристрій відключає його."], ["Застосунки", "Значки, пошук, фільтри (мої, системні, сміття, вимкнені, видалені), вимкнути й увімкнути, видалити й відновити, зупинити, очистити дані, зберегти APK, дозволи перемикачами, пакетні дії (зокрема пакетне видалення), захист критичних пакетів, кнопка «Очистити ОЗП»."], ["Чистильник зайвого", "Фільтр «Сміття» показує відомі непотрібні системні застосунки (Samsung, Google, Microsoft, служби Facebook, партнерські) з позначками «безпечно» та «обережно». «Обрати безпечні» і вимкнути; це оборотно («Вимкнені» → «Увімкнути»)."], ["Копії та версії", "Перед видаленням застосунку його APK зберігається. Кнопка «Версії» встановлює будь-яку версію, зокрема стару, зі збережених копій, з F-Droid або зі свого файлу."], ["Копія з даними", "Копія будь-якого застосунку разом із його даними та відновлення. З root зберігаються всі дані, через ADB лише те, що дозволяє система (зовнішні дані та, якщо застосунок дозволяє, внутрішні на Android 10 і старше). Системне вікно підтвердження програма натискає сама."], ["Захист головного екрана", "Єдиний головний екран не можна вимкнути або видалити помилково: якщо запасного немає, програма пропонує завантажити «Меню застосунків» з GitHub і ставить його одним натисканням (потрібен інтернет)."], ["Оновлення", "Перевіряє GitHub на нову версію за кнопкою й пропонує оновитися одним натисканням; у налаштуваннях можна ввімкнути автоматичну перевірку раз на добу (за замовчуванням вимкнена)."], ["Файли", "Двопанельний файловий менеджер: пам’ять телефона, карта пам’яті, USB-накопичувачі, архіви (ZIP, 7z, RAR, TAR), Android/data через ADB, мережеві теки й хмарні диски в одному дереві. Створити, перейменувати, копіювати, перемістити, видалити, ZIP, текстові файли, вбудований редактор, вибір за маскою, перетягування між панелями, кошик для телефона, карти, хмар і мережевих тек, вікно «Файл уже існує» («Перейменувати», «Замінити», «Скасувати», «Застосувати до всіх»). Після перезапуску повертаються теки й місця."], ["Хмарні диски", "Google Диск, MEGA, Dropbox, OneDrive, Яндекс Диск, Box, pCloud та десятки інших сервісів. Хмари працюють через окремий безкоштовний модуль «ADB-phon Хмари»: його пропонується завантажити один раз, коли додається хмара; завантажений файл після встановлення видаляється сам. Вхід у браузері; якщо спільний ключ програми зайнятий, майстер «Власний ключ» покроково допоможе створити свій."], ["Мережеві теки", "SMB, SFTP, FTP, FTPS і WebDAV: перегляд, копіювання й переміщення в обидва боки, зокрема напряму між двома мережевими джерелами та з хмари в мережу. Файл пишеться безпечно: оригінал не зникає при збої чи скасуванні."], ["Геймпад", "Телефон як геймпад для ПК через Bluetooth (вібрація з ПК) та екранний геймпад «Грати на цьому телефоні» (прототип): стики, A/B/X/Y, курки, Back, Guide і Start поверх будь-якої гри; розкладку, мертву зону, розмір і прозорість можна змінювати."], ["Телефон", "Відомості про пристрій, моніторинг, знімок і запис екрана, очищення кешу всіх застосунків, швидкі налаштування (темна тема, Wi-Fi, дані, Bluetooth, автоповорот, шрифт, згасання екрана, показ дотиків, анімації, DPI), перезавантаження (звичайне, recovery, завантажувач)."], ["Пристрої та Відеовікно", "У дереві «Файлів» одна група «Пристрої»: комп’ютери й Android-пристрої разом, у кожного теки «Файли» та «Відеовікно». «Відеовікно» показує екран комп’ютера або іншого Android і керує ним: автоповорот, введення тексту будь-якою мовою."], ["Відеодзвінок", "Відеодзвінок між Android-пристроями та комп’ютерами (Windows-програма «Телефон у вікні зі звуком» 3.0). Як подзвонити: відкрийте «Звʼязок → Відеодзвінки», натисніть «Додати людину…», впишіть імʼя й код його програми (XXXX-XXXX-XXXX; код є в програмі співрозмовника: на Windows у «Звʼязку через інтернет», на Android у цьому ж розділі), потім «Подзвонити». У співрозмовника зʼявиться вікно «Дзвонить…»; камера й мікрофон вмикаються, лише коли він натисне «Відповісти». Під час дзвінка кнопки «Звук», «Динамік», «Камера», «Завершити». Приймання дзвінків увімкнено за замовчуванням (значок у шторці), перемикач у тому ж розділі."], ["Запрошення", "Підключення до мережі Tailscale за запрошенням із ПК. Інший VPN вимикається на час сеансу звʼязку й повертається як був."], ["Сумісність із Shizuku", "Застосунки з підтримкою Shizuku отримують права shell через ADB-phon."], ["Консоль", "Живий термінал: будь-які команди оболонки, історія, Ctrl+C, Tab, «Мої команди»."], ["Налаштування", "Тема (авто, світла, темна), динамічні кольори зі шпалер і основний колір, розмір шрифту й елементів, режим «На весь екран», власні значки тек, файлів, дисків, застосунків і кнопок бічної панелі, мова (українська, російська, англійська), тримати екран увімкненим, журнал для пошуку помилок, резервна копія й відновлення налаштувань у вибрану теку, встановлення будь-якої версії програми з GitHub."], ["Безкоштовно", "Без реклами, відкритий код."]], "steps": ["Завантажте ADB-phon-7.0.apk і встановіть його (якщо Android запитає, дозвольте встановлення з цього джерела).", "Android 11 і новіше: «Налаштування» → «Для розробників» → увімкніть «Бездротове налагодження» → «Підключення пристрою за допомогою коду». Відкрийте ADB-phon у розділеному екрані або плаваючому вікні, введіть порт і код, натисніть «Сполучення», потім «Підключитись».", "Android 8–10: один раз з комп’ютера по USB виконайте adb tcpip 5555. В ADB-phon натисніть «Підключитись» і дозвольте налагодження на телефоні.", "Для іншого пристрою (телевізор, другий телефон) натисніть його у списку «Пристрої в мережі» або введіть IP."], "lims": ["Дії над системними застосунками можуть зламати телефон: будьте обережні, програма просить підтвердження й захищає критичні пакети.", "ADB-phon працює локально й нічого нікуди не надсилає. Помічник із курсором і пульт керують пристроєм цілком: підключайтеся лише до своїх пристроїв.", "У Google Play програми немає (такого там не дозволено): завантажуйте APK тут. Android може попередити про встановлення з невідомого джерела.", "Перевірено на трьох телефонах (Android 10 і 15) та ТВ-приставках (Android 9, 11, 12). На Android 8 і на пристроях x86 поки не перевірялося, відгуки вітаються.", "Для хмарних дисків потрібен окремий модуль «ADB-phon Хмари» (завантажується один раз, потрібен інтернет). Google Диск: спільний ключ програми пробний (перші 100 користувачів), далі створіть свій ключ у програмі. Архіви RAR5 підтримуються (зокрема з паролем). FTPS: перегляд і завантаження перевірено, вивантаження лише частково.", "SSH і «Миша ПК» нові й перевірені частково: SSH перевірено на сумісність з OpenSSH для Windows до етапу пароля; Bluetooth-миша є не на всіх телефонах (частина прошивок вимикає профіль HID).", "Особливі права на Xiaomi, Huawei та інших прошивках можуть відрізнятися; на Xiaomi увімкніть ще «Налагодження по USB (налаштування безпеки)».", "Відеовікно за адресою Tailscale (100.x) працює, якщо обидва пристрої в мережі Tailscale (за постійного іншого VPN на телефоні потрібна адреса тієї самої мережі). Введення тексту у Відеовікні будь-якою розкладкою потребує ADB-phon 7.0 або новішого на цільовому пристрої."], "smart": "APK підписано, але його немає в Google Play, тому Android може попросити дозволити встановлення з цього джерела. Контрольну суму SHA-256 вказано в описі релізу.", "note": "ADB-phon: незалежний проєкт, не пов’язаний з Google. Android — торгова марка Google LLC.", "f_rel": "Усі версії", "f_issue": "Повідомити про проблему", "f_src": "Код на GitHub", "f_contacts": "Контакти", "f_terms": "Правила та умови", "f_refund": "Правила повернення коштів", "f_oferta": "Публічний договір", "star_btn": "⭐ Зірка на GitHub", "star_p": "Безкоштовний спосіб допомогти: поставте зірку репозиторію на GitHub. Це нічого не коштує й допомагає іншим знайти програму.", "cap_v7_1": "Файли: група «Пристрої» для комп’ютерів і Android-пристроїв («Додати пристрій…»).", "cap_v7_2": "Налаштування: тема, мова, розмір шрифту й елементів, режим «На весь екран».", "cap_v5_1": "Файли: дві панелі, праворуч кнопки («Угору», «Оновити», «Копія», «Перенос», «Видалити», «Ім’я», «Нова тека», «Текстовий файл», «ZIP-архів», «Усі»), внизу панель вкладок із «Виходом».", "cap_v5_2": "Дерево «домівки»: пам’ять, кошик, мережа, хмарні диски та їхні кошики в одному місці.", "cap_v5_3": "Кошик хмари: позначте елементи й натисніть унизу «Відновити» або «Видалити назавжди».", "cap_v5_4": "Вікно «Файл уже існує»: «Перейменувати», «Замінити», «Скасувати».", "cap_v5_5": "Геймпад: «Грати», «Грати на цьому телефоні», перевірка, розкладка, мертва зона, розмір і прозорість.", "cap_v5_6": "Екранний геймпад поверх гри: стики, A/B/X/Y, курки й бампери, Back, Guide, Start.", "cap_v5_7": "Майстер «Власний ключ»: по одному короткому кроку, потрібні тексти самі потрапляють у буфер обміну.", "cap_v5_8": "Модуль хмар пропонується один раз, коли додається хмара."}};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function setLang(l){
  var d = I18N[l] || I18N.en;
  document.documentElement.lang = l;
  document.title = d.title;
  var nodes = document.querySelectorAll("[data-i]");
  for (var i = 0; i < nodes.length; i++){ var k = nodes[i].getAttribute("data-i"); if (d[k] != null) nodes[i].textContent = d[k]; }
  document.getElementById("features").innerHTML = d.feats.map(function(f){return '<div class="card"><b>'+esc(f[0])+'</b>'+esc(f[1])+'</div>'}).join("");
  document.getElementById("steps").innerHTML = d.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join("");
  var ia = document.getElementById("instr-link"); if (ia) ia.href = "https://github.com/drugoj00/adb-phon/blob/main/INSTRUCTION" + (l === "en" ? "" : "." + l) + ".md";
  document.getElementById("lims").innerHTML = d.lims.map(function(s){return '<li>'+esc(s)+'</li>'}).join("");
  ["main","channels","icons","device","scenes","sched"].forEach(function(k){ document.getElementById("img_"+k).src = "sl_"+k+"_"+l+".png"; });
  var b = document.querySelectorAll(".langs button");
  for (var j = 0; j < b.length; j++) b[j].setAttribute("aria-pressed", b[j].getAttribute("data-lang") === l ? "true" : "false");
  try { localStorage.setItem("piws-lang", l); } catch (e) {}
}
(function () { try { var x = new XMLHttpRequest(); x.open("GET", "https://api.github.com/repos/drugoj00/adb-phon/releases/latest"); x.onload = function () { try { var r = JSON.parse(x.responseText), a = r.assets || []; for (var i = 0; i < a.length; i++) { if (/\.apk$/i.test(a[i].name)) { document.getElementById("dl").href = a[i].browser_download_url; break; } } } catch (e) {} }; x.send(); } catch (e) {} })();
(function(){
  var b = document.querySelectorAll(".langs button");
  for (var i = 0; i < b.length; i++) b[i].addEventListener("click", function(){ setLang(this.getAttribute("data-lang")); });
  var l = null;
  try { l = localStorage.getItem("piws-lang"); } catch (e) {}
  if (!I18N[l]) { var n = (navigator.language || "en").slice(0, 2).toLowerCase(); l = n === "uk" ? "uk" : (n === "ru" || n === "be" ? "ru" : "en"); }
  setLang(l);
})();
</script>
